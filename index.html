<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diag</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
<style>
  body { font-family: monospace; background:#111; color:#0f0; padding:10px; word-break:break-all; }
  h3 { color:#fff; margin-top:20px; }
  pre { background:#000; padding:8px; white-space:pre-wrap; border:1px solid #333; }
  button { padding:10px; margin:5px 0; }
  #ready { background:#001a00; border:1px solid #0f0; padding:10px; font-size:14px; }
  #copyBtn { background:#0f0; color:#000; font-weight:bold; border:none; cursor:pointer; }
</style>
</head>
<body>

<h3>0. Готово для копипасты</h3>
<pre id="ready">жду данные...</pre>
<button id="copyBtn" onclick="copyReady()">Скопировать SESSION_KEY = "..."</button>

<h3>1. Raw launch params (location.search)</h3>
<pre id="params"></pre>

<h3>2. VKWebAppInit</h3>
<pre id="init">...</pre>

<button onclick="runToken()">3. VKWebAppGetAuthToken (append_local=true)</button>
<pre id="token">не запущено</pre>

<button onclick="runApiCall()">4. VKWebAppCallAPIMethod users.getCurrentUser (use_local=true)</button>
<pre id="apicall">не запущено</pre>

<script>
document.getElementById('params').textContent = window.location.search + '\n\n' + window.location.hash;

var state = { session_key: null, uid: null, fetchedAt: null };

function updateReady() {
  var out = document.getElementById('ready');
  if (!state.session_key) {
    out.textContent = 'жду session_key...';
    return;
  }
  var lines = [
    'SESSION_KEY = "' + state.session_key + '"',
    state.uid ? 'UID = "' + state.uid + '"' : 'UID = ?',
    'fetched_at = ' + state.fetchedAt
  ];
  out.textContent = lines.join('\n');
}

function copyReady() {
  var text = document.getElementById('ready').textContent;
  navigator.clipboard.writeText(text).catch(function(){});
}

function runToken() {
  var out = document.getElementById('token');
  out.textContent = 'запрос...';
  vkBridge.send('VKWebAppGetAuthToken', { app_id: 54684480, scope: '', append_local: true })
    .then(function(r) {
      out.textContent = JSON.stringify(r, null, 2);
      if (r && r.access_token) {
        state.session_key = r.access_token;
        state.fetchedAt = new Date().toISOString();
        updateReady();
      }
      runApiCall();
    })
    .catch(function(e) { out.textContent = 'ERROR: ' + JSON.stringify(e, null, 2); });
}

function runApiCall() {
  var out = document.getElementById('apicall');
  out.textContent = 'запрос...';
  vkBridge.send('VKWebAppCallAPIMethod', {
    method: 'users.getCurrentUser',
    params: {},
    use_local: true
  })
    .then(function(r) {
      out.textContent = JSON.stringify(r, null, 2);
      try {
        var parsed = typeof r.response === 'string' ? JSON.parse(r.response) : r.response;
        if (parsed && parsed.uid) {
          state.uid = parsed.uid;
        } else if (Array.isArray(parsed) && parsed[0] && parsed[0].uid) {
          state.uid = parsed[0].uid;
        }
      } catch (e) {}
      updateReady();
    })
    .catch(function(e) { out.textContent = 'ERROR: ' + JSON.stringify(e, null, 2); });
}

vkBridge.send('VKWebAppInit')
  .then(function(r) {
    document.getElementById('init').textContent = JSON.stringify(r);
    runToken();
  })
  .catch(function(e) {
    document.getElementById('init').textContent = 'ERROR: ' + JSON.stringify(e);
  });
</script>
</body>
</html>
</content>
